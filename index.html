/* ── State ─────────────────────────────────────────────── */
let lang = "nl";
let answers = [];
let step = 0;
const card = document.getElementById("card");

function t(){ return T[lang]; }
function Q(){ return t().questions; }

function switchLang(l){
  lang = l;
  document.documentElement.lang = t().htmlLang;
  document.title = t().title;
  document.querySelector('meta[name="description"]').content = t().desc;
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === l));
  // Update footer
  document.querySelector(".footer").innerHTML = `<a href="https://pelicano.be" target="_blank" rel="noopener">Pelicano</a> × <a href="https://queenpaolafoundation.be" target="_blank" rel="noopener">${t().footerOrg}</a>`;
  // Reset quiz and show intro
  answers = [];
  step = 0;
  showIntro();
}

function logoHeader(){
  return `<div class="logo-header">${SVG_PELICANO}<div class="logo-sep"></div>${SVG_FRP}</div>`;
}

function render(html){
  card.innerHTML = html;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ── Screens ───────────────────────────────────────────── */
function showIntro(){
  const l = t();
  render(`
    ${logoHeader()}
    <p class="eyebrow">${l.eyebrow}</p>
    <h1>${l.heading}</h1>
    <p style="font-size:1.05rem;margin-bottom:20px">${l.sub}</p>
    <div style="background:var(--warm);border:1px solid var(--line);border-radius:14px;padding:18px 18px;margin-bottom:24px">
      <p style="font-size:.88rem;margin-bottom:0;color:var(--muted)">
        <strong style="color:var(--navy);display:block;margin-bottom:4px">${l.infoTitle}</strong>
        ${l.infoText}
      </p>
    </div>
    <button class="btn btn-primary" id="start">${l.startBtn}</button>
  `);
  document.getElementById("start").onclick = () => { step = 1; showQuestion(); };
}

function showQuestion(){
  const qi = step - 1;
  const q = Q()[qi];
  const l = t();
  const pct = Math.round((qi / Q().length) * 100);
  const opts = q.opts.map((o, i) =>
    `<button class="opt" data-i="${i}">
      <span class="mark">${String.fromCharCode(65 + i)}</span>
      <span>${o}</span>
    </button>`
  ).join("");
  render(`
    ${logoHeader()}
    <div class="prog-wrap">
      <div class="prog-header">
        <span class="prog-label">${l.qOf.replace('%d',step).replace('%t',Q().length)}</span>
        <span class="prog-label">${l.done.replace('%d',pct)}</span>
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    <p class="q-text">${q.q}</p>
    <div class="options">${opts}</div>
  `);
  document.querySelectorAll(".opt").forEach(btn => {
    btn.onclick = () => pick(qi, parseInt(btn.dataset.i, 10), btn);
  });
}

function pick(qi, i, btn){
  document.querySelectorAll(".opt").forEach(b => b.setAttribute("disabled", ""));
  btn.classList.add("selected");
  answers[qi] = i;
  setTimeout(() => { step++; step <= Q().length ? showQuestion() : showLoader(); }, 300);
}

function showLoader(){
  const l = t();
  render(`
    ${logoHeader()}
    <div class="loader">
      <div class="loader-text">${l.loaderText}</div>
      <div class="loader-track"><div class="loader-fill" id="lf"></div></div>
    </div>
  `);
  requestAnimationFrame(() => {
    const lf = document.getElementById("lf");
    requestAnimationFrame(() => { lf.style.width = "100%"; });
  });
  setTimeout(() => showGate(), 1700);
}

function showGate(){
  const l = t();
  render(`
    ${logoHeader()}
    <div class="gate-icon" aria-hidden="true">&#128161;</div>
    <h2>${l.gateTitle}</h2>
    <p style="margin-bottom:18px">${l.gateSub}</p>
    <p style="font-size:.8rem;color:var(--muted);text-align:center;font-weight:600;margin-bottom:14px">${l.socialProof}</p>
    <div class="score-tease">
      <div class="blur" aria-hidden="true">?/5</div>
      <div class="st-text">
        <strong>${l.scoreTease}</strong>
        ${l.scoreTeaseText}
      </div>
    </div>
    <div class="field-group">
      <div class="field">
        <label for="fname">${l.labelFirstName}</label>
        <input type="text" id="fname" autocomplete="given-name" placeholder="${l.placeholderFirstName}">
      </div>
      <div class="field">
        <label for="lname">${l.labelLastName}</label>
        <input type="text" id="lname" autocomplete="family-name" placeholder="${l.placeholderLastName}">
      </div>
      <div class="field">
        <label for="email">${l.labelEmail}</label>
        <input type="email" id="email" inputmode="email" autocomplete="email" placeholder="${l.placeholderEmail}">
        <p class="errmsg" id="err">${l.emailErr}</p>
      </div>
      <div class="field">
        <label for="phone">${l.labelPhone}</label>
        <input type="tel" id="phone" autocomplete="tel" inputmode="tel" placeholder="${l.placeholderPhone}">
      </div>
    </div>
    <div style="position:absolute;left:-9999px" aria-hidden="true">
      <input type="text" id="website" tabindex="-1" autocomplete="off">
    </div>
    <label class="gdpr-check">
      <input type="checkbox" id="gdpr">
      <span>${l.gdprLabel}</span>
    </label>
    <p class="errmsg" id="gdpr-err">${l.gdprErr}</p>
    <button class="btn btn-primary" id="submit">${l.gateBtn}</button>
    <p class="fineprint">${l.fineprint}</p>
  `);
  const emailEl = document.getElementById("email");
  const errEl   = document.getElementById("err");
  const gdprEl  = document.getElementById("gdpr");
  const gdprErr = document.getElementById("gdpr-err");
  emailEl.addEventListener("input", () => { emailEl.classList.remove("err"); errEl.classList.remove("show"); });
  gdprEl.addEventListener("change", () => { gdprErr.classList.remove("show"); });
  const submit = () => {
    const email = emailEl.value.trim();
    const fname = document.getElementById("fname").value.trim();
    const lname = document.getElementById("lname").value.trim();
    const phone = document.getElementById("phone").value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      emailEl.classList.add("err"); errEl.classList.add("show"); emailEl.focus(); return;
    }
    if(!gdprEl.checked){
      gdprErr.classList.add("show"); return;
    }
    if(document.getElementById("website").value){ return; } // honeypot
    saveLead(fname, lname, email, phone);
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: "quiz_lead_submit", form_name: "quiz-leads", quiz_lang: lang, quiz_score: calcScore() });
    showResults(fname);
  };
  document.getElementById("submit").onclick = submit;
  emailEl.addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
}

function calcScore(){ return answers.filter((a, i) => a === Q()[i].correct).length; }

/* ── UTM capture (stored on page load) ─────────────────── */
const UTM_KEYS = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term"];
const _utmParams = {};
(function(){
  const params = new URLSearchParams(window.location.search);
  UTM_KEYS.forEach(k => { const v = params.get(k); if(v) _utmParams[k] = v; });
})();

const SHEET_URL = "https://script.google.com/macros/s/AKfycbzs_xBH8WVsh5-HoVoQR7Phcm7Kt9vcnMDzfsmtlNAq06OLP8316oXZ8FdQfCGbaIC8bg/exec";

async function saveLead(fname, lname, email, phone){
  const score = calcScore();
  const payload = { lang, fname, lname, email, phone, score, answers: JSON.stringify(answers), ts: new Date().toISOString(), ..._utmParams };
  if(!SHEET_URL){ console.log("LEAD (no SHEET_URL) →", payload); return; }
  try {
    await fetch(SHEET_URL, { method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain"}, body: JSON.stringify(payload) });
  } catch(e){
    console.error("Lead save failed:", e);
  }
}

function showResults(fname){
  const l = t();
  const qs = Q();
  const score = calcScore();
  const g = fname ? `${fname}, ` : "";
  let msg, sub;
  if(score===5){    msg=l.score5[0];  sub=l.score5[1]; }
  else if(score>=3){msg=l.score34[0]; sub=l.score34[1]; }
  else if(score>=1){msg=l.score12[0]; sub=l.score12[1]; }
  else{             msg=l.score0[0];  sub=l.score0[1]; }

  const gapCards = qs.map((q, i) => {
    const userIdx   = answers[i];
    const userPct   = q.optPcts[userIdx];
    const realPct   = q.correctPct;
    const isCorrect = userIdx === q.correct;
    const cls       = isCorrect ? "right" : "wrong";
    const badgeText = isCorrect ? l.correct : (userPct < realPct ? l.under : l.over);
    const badge     = `<span class="result-badge ${isCorrect ? 'rb-right' : 'rb-wrong'}">${badgeText}</span>`;
    const left  = Math.min(userPct, realPct);
    const width = Math.abs(userPct - realPct);
    const MIN_GAP = 15;
    let youLeft = userPct, realLeft = realPct;
    if(!isCorrect && width < MIN_GAP){
      const mid = (userPct + realPct) / 2;
      youLeft  = Math.max(2, mid - MIN_GAP / 2);
      realLeft = Math.min(98, mid + MIN_GAP / 2);
      if(userPct > realPct){ [youLeft, realLeft] = [realLeft, youLeft]; }
    }
    const markers = isCorrect
      ? `<div class="scale-marker marker-real" style="left:${realPct}%">
            <div class="pin"></div>
            <div class="pin-label">${l.correctLabel}<br><strong style="font-size:.76rem">${q.label}</strong></div>
          </div>`
      : `<div class="scale-marker marker-you" style="left:${youLeft}%">
            <div class="pin"></div>
            <div class="pin-label">${l.yourGuess}<br><strong style="font-size:.76rem">${q.opts[userIdx]}</strong></div>
          </div>
          <div class="scale-marker marker-real" style="left:${realLeft}%">
            <div class="pin"></div>
            <div class="pin-label">${l.real}<br><strong style="font-size:.76rem">${q.label}</strong></div>
          </div>`;
    return `
      <div class="gap-card ${cls}">
        <div class="gap-card-header">
          <p class="gap-q">${q.q}</p>${badge}
        </div>
        <div class="scale-track" role="img" aria-label="${l.yourGuess}: ${q.opts[userIdx]}, ${l.real}: ${q.label}">
          <div class="scale-fill" id="sf${i}" style="left:${left}%;width:0%"></div>
          ${markers}
        </div>
        <p class="gap-fact" style="margin-top:6px">${q.fact}</p>
        <p class="gap-source">${l.source}: ${q.source}</p>
      </div>`;
  }).join("");

  render(`
    ${logoHeader()}

    <div class="dont-feel">
      <strong>${l.dontFeel}</strong>
      ${l.dontFeelSub}
    </div>

    <div class="score-badge">
      <div class="badge-score">${score}/5</div>
      <div class="badge-label"><strong>${g}${msg}</strong>${sub}</div>
    </div>

    <h2>${l.gapTitle}</h2>
    <div class="gap-cards">${gapCards}</div>

    <div class="stat-strip">
      <div class="stat-box"><div class="stat-n">${l.stat1n}</div><div class="stat-l">${l.stat1l}</div></div>
      <div class="stat-box"><div class="stat-n">${l.stat2n}</div><div class="stat-l">${l.stat2l}</div></div>
      <div class="stat-box"><div class="stat-n">${l.stat3n}</div><div class="stat-l">${l.stat3l}</div></div>
    </div>

    <h2>${l.testiTitle}</h2>
    <div class="testimonials">
      <div class="testi">
        <p class="testi-text">${l.testi1}</p>
        <p class="testi-source">${l.testi1src}</p>
      </div>
      <div class="testi">
        <p class="testi-text">${l.testi2}</p>
        <p class="testi-source">${l.testi2src}</p>
      </div>
      <div class="testi">
        <p class="testi-text">${l.testi3}</p>
        <p class="testi-source">${l.testi3src}</p>
      </div>
    </div>

    <div class="cta-block">
      <h2>${l.ctaTitle}</h2>
      <p>${l.ctaSub}</p>
      <a class="btn-white" href="${l.ctaUrl}" target="_blank" rel="noopener">${l.ctaBtn}</a>
    </div>

    <div class="collo-block">
      <div class="collo-label">${l.colloLabel}</div>
      <h3 class="collo-title">${l.colloTitle}</h3>
      <p class="collo-desc">${l.colloDesc}</p>
      <p class="collo-meta"><span class="collo-meta-label">${l.colloDatumLabel}</span> <strong>${l.colloDate}</strong>${l.colloDateDetail}</p>
      <p class="collo-meta"><span class="collo-meta-label">${l.colloLocatieLabel}</span> ${l.colloLocation}</p>
      <p class="collo-meta"><span class="collo-meta-label">${l.colloVoorWieLabel}</span> ${l.colloAudience}</p>
      <a class="btn collo-btn" href="${l.colloUrl}" target="_blank" rel="noopener">${l.colloBtn}</a>
    </div>

    <div class="stack">
      <button class="btn btn-ghost" id="share">${l.shareBtn}</button>
      <button class="btn btn-ghost" id="restart">${l.restartBtn}</button>
    </div>
  `);

  requestAnimationFrame(() => {
    qs.forEach((q, i) => {
      const el = document.getElementById(`sf${i}`);
      if(!el) return;
      const width = Math.abs(q.optPcts[answers[i]] - q.correctPct);
      requestAnimationFrame(() => { el.style.width = width + "%"; });
    });
  });

  document.getElementById("share").onclick = async () => {
    const text = l.shareText.replace('%s', score);
    const url  = window.location.href;
    try {
      if(navigator.share){ await navigator.share({ title: l.shareTitle, text, url }); }
      else { await navigator.clipboard.writeText(text + " " + url); document.getElementById("share").textContent = "✓ " + (lang==='nl' ? "Link gekopieerd!" : "Lien copié !"); }
    } catch(e){}
  };
  document.getElementById("restart").onclick = () => { answers = []; step = 0; showIntro(); };
}

/* ── Init ──────────────────────────────────────────────── */
// Detect browser language preference
const browserLang = (navigator.language || "").toLowerCase();
if(browserLang.startsWith("fr")){
  switchLang("fr");
} else {
  showIntro();
}
</script>
